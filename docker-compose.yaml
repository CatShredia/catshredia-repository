version: "3.8" # Рекомендуется указывать версию для совместимости

services:
  nginx:
    image: "nginx:stable-alpine"
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro # Более правильный путь для конфигурации Nginx
      - ./src:/var/www/laravel
    depends_on: # Указываем зависимость от php, чтобы Nginx ждал, пока php запустится
      - mysql
      - php

  php:
    build:
      context: dockerfiles
      dockerfile: php.dockerfile
    volumes:
      - ./src:/var/www/laravel
    environment: # Переносим переменные окружения сюда
      - MYSQL_DATABASE=laravel_db
      - MYSQL_USER=laravel
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=password
    depends_on: # Указываем зависимость от mysql
      - mysql

  mysql:
    image: "mysql:8.0"
    ports:
      - "3316:3306"
    env_file:
      - env/mysql.env # Оставляем как есть, но убедитесь, что файл существует и правильно настроен

  composer:
    build:
      context: dockerfiles
      dockerfile: composer.dockerfile
    volumes:
      - ./src:/var/www/laravel
    depends_on:
      - php # Композеру нужен PHP
  artisan:
    build:
      context: dockerfiles
      dockerfile: php.dockerfile
    volumes:
      - ./src:/var/www/laravel
    entrypoint: ["php", "/var/www/laravel/artisan"]
