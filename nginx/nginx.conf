server {
    listen 80;
    server_name localhost;

    root /var/www/laravel/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;

        # CORS
        # разрешаем запросы только с этого же сайта
        add_header 'Access-Control-Allow-Origin' "$http_origin";
        # разрешаем отправлять только такие типы запроса
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        # много конфидециальной информации
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
        # можно ли принимать и отправлять cookie файлы с других источников
        add_header 'Access-Control-Allow-Credentials' 'true';
        # время, на которое браузер может кэшировать результаты
        add_header 'Access-Control-Max-Age' 3600;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    server_tokens off;
}