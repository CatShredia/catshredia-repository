version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=testozonDB;Username=user;Password=123
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: testozonDB
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123
    ports:
      - "5430:5432"
    volumes:
      - pg:/var/lib/postgresql/data

volumes:
  pg: