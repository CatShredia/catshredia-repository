<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEM test</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="normalize.css">
</head>

<body>
    <h1 class="body__title">Elements:</h1>
    <div class="body__body">
        <button type="button" class="btn">Кнопка</button>

        <div class="rating">
            <img class="rating__star" src="rec/icon_1.svg" alt="Рейтинг 4 из 5">
            <img class="rating__star" src="rec/icon_1.svg" alt="">
            <img class="rating__star" src="rec/icon_1.svg" alt="">
            <img class="rating__star" src="rec/icon_1.svg" alt="">
            <img class="rating__star" src="rec/icon_2.svg" alt="">
        </div>

        <div class="card">
            <img src="rec/photo.jpg" alt="Ресторан" class="card__img">
            <div class="card__body">
                <div class="card__price-rating">
                    <strong class="card__price">1000 руб</strong>

                    <div class="rating card__rating">
                        <img class="rating__star" src="rec/icon_1.svg" alt="Рейтинг 4 из 5">
                        <img class="rating__star" src="rec/icon_1.svg" alt="">
                        <img class="rating__star" src="rec/icon_1.svg" alt="">
                        <img class="rating__star" src="rec/icon_1.svg" alt="">
                        <img class="rating__star" src="rec/icon_2.svg" alt="">
                    </div>
                </div>
                <h3 class="card__title">Название</h3>
                <span class="card__location">Локация</span>
                <button type="button" class="btn card__btn">Кнопка</button>

            </div>
        </div>
    </div>

</body>

</html>
